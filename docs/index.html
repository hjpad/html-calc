<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Calc - Calculator IDE</title>

    <link rel="icon" type="image/x-icon" href="images/favicons/favicon.ico">
        <link rel="icon" type="image/png" sizes="16x16" href="images/favicons/favicon-16x16.png">
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicons/favicon-32x32.png">
        <link rel="apple-touch-icon" sizes="180x180" href="images/favicons/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="96x96" href="images/favicons/favicon-96x96.png">
        <link rel="icon" type="image/png" sizes="144x144" href="images/favicons/favicon-144x144.png">
        <link rel="icon" type="image/png" sizes="192x192" href="images/favicons/android-chrome-192x192.png">
        <link rel="icon" type="image/png" sizes="512x512" href="images/favicons/android-chrome-512x512.png">

	<link rel="manifest" href="site.webmanifest">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a href="https://github.com/hjpad/html-calc" target="_blank" class="navbar-brand mb-0 h1 text-decoration-none">
                <i class="bi bi-calculator"></i> html_calc
            </a>
        </div>
    </header>

    <div class="container-fluid main-content">
        <div class="row h-100">
            <div class="col-md-6 editor-panel">
                <div class="panel-header">
                    <h6 class="mb-0">
                        <span class="input-header-content">
                            <i class="bi bi-pencil-square"></i> Input Editor
                        </span>
                        <span class="mobile-view-toggle" id="showOutputBtn">
                            <i class="bi bi-eye"></i>
                        </span>
                    </h6>
                </div>
                <textarea id="inputEditor" class="form-control editor-textarea" placeholder="Enter your markdown and formulas here...

Example:
# My Calculations
## Basic Math
a = 10
b = 20
sum = a + b =
## Area Calculation
radius = 5
area = 3.14159 * radius^2 =
## Results
The sum is: {sum}
The area is: {area}"></textarea>
            </div>

            <div class="col-md-6 output-panel">
                <div class="panel-header">
                    <h6 class="mb-0">
                        <span class="mobile-view-toggle" id="showInputBtn">
                            <i class="bi bi-pencil-square"></i>
                        </span>
                        <span class="output-header-content">
                            <i class="bi bi-eye"></i> Output View
                        </span>
                        <i class="bi bi-arrow-repeat calculating-indicator hidden"></i>
                    </h6>
                </div>
                <div id="outputPreview" class="output-content">
                    <div class="text-muted text-center mt-5">
                        <i class="bi bi-arrow-left-circle" style="font-size: 3rem;"></i>
                        <p class="mt-3">Enter your markdown and formulas, then click Calculate</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.11.0/lib/browser/math.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
